<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Advanced Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">

    <div class="calculator-card">
        <div class="calc-header">
            <div class="header-dots">
                <button class="theme-toggle" id="themeToggle"><i class="fa-regular fa-moon"></i></button>
                <button class="deg-rad-btn" id="degRadToggle">RAD</button>
            </div>
            <div class="mode-indicator">
                <span id="memoryStatus" class="fw-bold"></span>
                <span id="shiftStatus" class="fw-bold"></span>
            </div>
        </div>

        <div class="display-wrapper">
            <div id="formulaPreview" class="mb-1"></div>
            <input type="text" id="display" placeholder="0" readonly>
        </div>

        <div class="grid-block scientific-grid">
            <button class="btn-calc btn-sci" id="shiftBtn">2nd</button>
            <button class="btn-calc btn-sci" data-val="(">(</button>
            <button class="btn-calc btn-sci" data-val=")">)</button>
            <button class="btn-calc btn-sci" data-val="%">%</button>
            <button class="btn-calc btn-sci" data-val="1/">1/x</button>
            <button class="btn-calc btn-sci" data-val="**2">x²</button>

            <button class="btn-calc btn-sci shiftswappable" data-val="sin(" data-shiftval="asin(">sin</button>
            <button class="btn-calc btn-sci shiftswappable" data-val="cos(" data-shiftval="acos(">cos</button>
            <button class="btn-calc btn-sci shiftswappable" data-val="tan(" data-shiftval="atan(">tan</button>
            <button class="btn-calc btn-sci" data-val="**">yˣ</button>
            <button class="btn-calc btn-sci" data-action="factorial">x!</button>
            <button class="btn-calc btn-sci" data-val="sqrt(">√</button>

            <button class="btn-calc btn-sci shiftswappable" data-val="sinh(" data-shiftval="asinh(">sinh</button>
            <button class="btn-calc btn-sci shiftswappable" data-val="cosh(" data-shiftval="acosh(">cosh</button>
            <button class="btn-calc btn-sci shiftswappable" data-val="tanh(" data-shiftval="atanh(">tanh</button>
            <button class="btn-calc btn-sci shiftswappable" data-val="log(" data-shiftval="10**">log</button>
            <button class="btn-calc btn-sci shiftswappable" data-val="ln(" data-shiftval="exp(">ln</button>
            <button class="btn-calc btn-sci" data-val="Math.PI">π</button>

            <button class="btn-calc btn-sci" data-action="memClear">mc</button>
            <button class="btn-calc btn-sci" data-action="memRecall">mr</button>
            <button class="btn-calc btn-sci" data-action="memAdd">m+</button>
            <button class="btn-calc btn-sci" data-action="memSub">m-</button>
            <button class="btn-calc btn-sci" data-val="Ans">Ans</button>
            <button class="btn-calc btn-sci" data-action="random">Rand</button>
        </div>

        <div class="grid-block standard-grid">
            <button class="btn-calc btn-num" data-val="7">7</button>
            <button class="btn-calc btn-num" data-val="8">8</button>
            <button class="btn-calc btn-num" data-val="9">9</button>
            <button class="btn-calc btn-num btn-orange" data-action="clear">AC</button>
            <button class="btn-calc btn-num btn-orange" data-action="delete">DEL</button>

            <button class="btn-calc btn-num" data-val="4">4</button>
            <button class="btn-calc btn-num" data-val="5">5</button>
            <button class="btn-calc btn-num" data-val="6">6</button>
            <button class="btn-calc btn-num operator" data-val="*">×</button>
            <button class="btn-calc btn-num operator" data-val="/">÷</button>

            <button class="btn-calc btn-num" data-val="1">1</button>
            <button class="btn-calc btn-num" data-val="2">2</button>
            <button class="btn-calc btn-num" data-val="3">3</button>
            <button class="btn-calc btn-num operator" data-val="+">+</button>
            <button class="btn-calc btn-num operator" data-val="-">−</button>

            <button class="btn-calc btn-num" data-val="0">0</button>
            <button class="btn-calc btn-num" data-val=".">.</button>
            <button class="btn-calc btn-num" data-action="negate">+/-</button>
            <button class="btn-calc btn-num equal" data-action="calculate" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <div class="side-panel">
        <div class="panel-header">
            <h5>History Logs</h5>
            <button class="clear-hist-btn" id="clearHistoryBtn"><i class="fa-regular fa-trash-can me-1"></i>Clear</button>
        </div>
        <div class="side-panel-content" id="historyList"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
