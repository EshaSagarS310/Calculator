<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center main-bg">

    <div class="calculator-wrapper row g-4">

        <!-- Calculator -->
        <div class="col-lg-8 col-md-12">

            <div class="calculator glass-card p-4">

                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="title">Advanced Calculator</h3>

                    <button class="theme-toggle" id="themeToggle">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>

                <!-- Display -->
                <div class="display-container mb-4">
                    <input type="text" id="display" readonly>
                </div>

                <!-- Scientific Buttons -->
                <div class="row g-2 mb-2">
                    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('Math.sin(')">sin</button></div>
                    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('Math.cos(')">cos</button></div>
                    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('Math.tan(')">tan</button></div>
                    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('Math.log10(')">log</button></div>
                </div>

                <div class="row g-2 mb-2">
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('Math.sqrt(')">√</button></div>
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('**2')">x²</button></div>
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('3.14159')">π</button></div>
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('2.71828')">e</button></div>
</div>

<div class="row g-2 mb-3">
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('(')">(</button></div>
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue(')')">)</button></div>
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('factorial(')">x!</button></div>
    <div class="col-3"><button class="btn-calc scientific" onclick="appendValue('**')">xʸ</button></div>
</div>

                <!-- Calculator Buttons -->
                <div class="row g-2">

                    <div class="col-3"><button class="btn-calc danger" onclick="clearDisplay()">AC</button></div>
                    <div class="col-3"><button class="btn-calc warning" onclick="deleteLast()">DEL</button></div>
                    <div class="col-3"><button class="btn-calc operator" onclick="appendValue('%')">%</button></div>
                    <div class="col-3"><button class="btn-calc operator" onclick="appendValue('/')">÷</button></div>

                    <div class="col-3"><button class="btn-calc" onclick="appendValue('7')">7</button></div>
                    <div class="col-3"><button class="btn-calc" onclick="appendValue('8')">8</button></div>
                    <div class="col-3"><button class="btn-calc" onclick="appendValue('9')">9</button></div>
                    <div class="col-3"><button class="btn-calc operator" onclick="appendValue('*')">×</button></div>

                    <div class="col-3"><button class="btn-calc" onclick="appendValue('4')">4</button></div>
                    <div class="col-3"><button class="btn-calc" onclick="appendValue('5')">5</button></div>
                    <div class="col-3"><button class="btn-calc" onclick="appendValue('6')">6</button></div>
                    <div class="col-3"><button class="btn-calc operator" onclick="appendValue('-')">−</button></div>

                    <div class="col-3"><button class="btn-calc" onclick="appendValue('1')">1</button></div>
                    <div class="col-3"><button class="btn-calc" onclick="appendValue('2')">2</button></div>
                    <div class="col-3"><button class="btn-calc" onclick="appendValue('3')">3</button></div>
                    <div class="col-3"><button class="btn-calc operator" onclick="appendValue('+')">+</button></div>

                    <div class="col-3"><button class="btn-calc" onclick="appendValue('0')">0</button></div>
                    <div class="col-3"><button class="btn-calc" onclick="appendValue('.')">.</button></div>
                    <div class="col-6"><button class="btn-calc equal" onclick="calculate()">=</button></div>
                </div>

            </div>
        </div>

        <!-- History -->
        <div class="col-lg-4 col-md-12">
            <div class="history-panel glass-card p-3">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>History</h4>
                    <button class="clear-history" onclick="clearHistory()">
                        Clear
                    </button>
                </div>

                <div id="historyList"></div>

            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
